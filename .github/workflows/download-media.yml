name: Download Media and Send Email

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL of the media to download (Wikimedia Commons, direct links)'
        required: true
        type: string

jobs:
  download-and-email:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download and send email
        run: |
          python download_and_email.py "${{ github.event.inputs.url }}"
