name: Extract Media URLs from Wikimedia

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Wikimedia page URL (Category, search results, etc.)'
        required: true
        type: string
      direct:
        description: 'Get direct CDN URLs (not wiki pages)'
        required: false
        type: boolean
        default: true
      videos_only:
        description: 'Only video files'
        required: false
        type: boolean
        default: false
      limit:
        description: 'Max number of results'
        required: false
        type: number
        default: 50

jobs:
  extract-urls:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Extract URLs
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.direct }}" == "true" ]; then
            ARGS="$ARGS --direct"
          fi
          if [ "${{ github.event.inputs.videos_only }}" == "true" ]; then
            ARGS="$ARGS --videos-only"
          fi
          python extract_urls.py "${{ github.event.inputs.url }}" $ARGS --limit ${{ github.event.inputs.limit }}
